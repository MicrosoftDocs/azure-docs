<svg xmlns="http://www.w3.org/2000/svg" width="1320" height="340" viewBox="0 0 1320 340" role="img" aria-labelledby="title desc">
  <title id="title">Route readings by severity</title>
  <desc id="desc">Read telemetry/sensors. A built-in filter drops readings where temperature is greater than 1000. A built-in branch sends severity greater than 5 on its true output to an alert map; other readings use the false output and normal map. Both maps rename deviceId to id and temperature to temp without converting units. Only the alert map adds alert true. Built-in concatenate forwards individual messages, not joined records, to telemetry/processed.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#365d7e"/></marker>
  </defs>
  <rect width="1320" height="340" fill="#fff"/>
  <g fill="none" stroke="#365d7e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 165 170 H 195"/>
    <path d="M 405 170 H 440"/>
    <path d="M 620 150 H 650 V 85 H 700"/>
    <path d="M 620 190 H 650 V 255 H 700"/>
    <path d="M 895 85 H 930 V 150 H 965"/>
    <path d="M 895 255 H 930 V 190 H 965"/>
    <path d="M 1115 170 H 1145"/>
  </g>
  <g stroke-width="1.5">
    <rect x="15" y="130" width="150" height="80" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="195" y="115" width="210" height="110" rx="10" fill="#e7f3e8" stroke="#2e6943"/>
    <rect x="440" y="130" width="180" height="80" rx="10" fill="#e7f3e8" stroke="#2e6943"/>
    <rect x="700" y="20" width="195" height="130" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="700" y="200" width="195" height="110" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="965" y="115" width="150" height="110" rx="10" fill="#e7f3e8" stroke="#2e6943"/>
    <rect x="1145" y="130" width="160" height="80" rx="10" fill="#eef5fc" stroke="#365d7e"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#172b3a" text-anchor="middle">
    <text x="90" y="163"><tspan x="90" font-weight="bold">Source</tspan><tspan x="90" dy="24">telemetry/sensors</tspan></text>
    <text x="300" y="150"><tspan x="300" font-weight="bold">BUILT-IN filter</tspan><tspan x="300" dy="25">Drop temperature</tspan><tspan x="300" dy="25">&gt; 1000</tspan></text>
    <text x="530" y="163"><tspan x="530" font-weight="bold">BUILT-IN branch</tspan><tspan x="530" dy="24">severity &gt; 5?</tspan></text>
    <text x="797" y="49"><tspan x="797" font-weight="bold">BUILT-IN map</tspan><tspan x="797" dy="25">deviceId → id</tspan><tspan x="797" dy="25">temperature → temp</tspan><tspan x="797" dy="25">alert = true</tspan></text>
    <text x="797" y="230"><tspan x="797" font-weight="bold">BUILT-IN map</tspan><tspan x="797" dy="25">deviceId → id</tspan><tspan x="797" dy="25">temperature → temp</tspan></text>
    <text x="1040" y="150"><tspan x="1040" font-weight="bold">BUILT-IN</tspan><tspan x="1040" dy="25">concatenate</tspan><tspan x="1040" dy="25">Not a join</tspan></text>
    <text x="1225" y="163"><tspan x="1225" font-weight="bold">Destination</tspan><tspan x="1225" dy="24">telemetry/processed</tspan></text>
    <text x="650" y="48"><tspan x="650">true:</tspan><tspan x="650" dy="22">high severity</tspan></text>
    <text x="650" y="289"><tspan x="650">false:</tspan><tspan x="650" dy="22">severity ≤ 5</tspan></text>
  </g>
</svg>
