<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Keep running totals</title>
  <desc id="desc">For sensor-1 starting at zero, readings of 2.5 and 1.5 kWh produce running totals of 2.5 and 4 kWh. Each reading is an amount to add, not a lifetime meter reading. An authorized reset returns the total to zero. This is a behavior summary, not a graph node map.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#365d7e"/></marker>
  </defs>
  <rect width="1200" height="300" fill="#fff"/>
  <g fill="none" stroke="#365d7e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 155 H 365"/>
    <path d="M 825 155 H 870"/>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="70" width="300" height="155" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="375" y="70" width="450" height="155" rx="10" fill="#e7f3e8" stroke="#2e6943"/>
    <rect x="880" y="70" width="300" height="155" rx="10" fill="#eef5fc" stroke="#365d7e"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#172b3a">
    <text x="20" y="38" font-size="26" font-weight="bold">Keep running totals</text>
    <text x="40" y="105" font-weight="bold">Amounts to add</text>
    <text x="40" y="150" font-size="28">2.5, then 1.5 kWh</text>
    <text x="40" y="195">In order, for sensor-1</text>
    <text x="395" y="105" font-weight="bold">Add each amount to the total</text>
    <text x="395" y="150">Start at zero: 0 + 2.5 = 2.5</text>
    <text x="395" y="195">Then: 2.5 + 1.5 = 4</text>
    <text x="900" y="105" font-weight="bold">Running totals</text>
    <text x="900" y="150" font-size="28">2.5, then 4 kWh</text>
    <text x="900" y="195">Authorized reset: back to 0</text>
    <text x="20" y="270">Totals are held in memory. Save them and the ordered inputs externally to recover after a restart.</text>
  </g>
</svg>
