<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">Detect offline sensors</title>
  <desc id="desc">Register sensor-1 at 0.1 seconds. With no readings, a clock event at 1.1 seconds detects 1 second of silence and reports offline. A reading of 10 at 1.3 seconds reports online again. This is a behavior summary, not a graph node map.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#365d7e"/></marker>
  </defs>
  <rect width="1200" height="340" fill="#fff"/>
  <g fill="none" stroke="#365d7e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 320 175 H 365"/>
    <path d="M 825 175 H 870"/>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="70" width="300" height="195" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="375" y="70" width="450" height="195" rx="10" fill="#e7f3e8" stroke="#2e6943"/>
    <rect x="880" y="70" width="300" height="195" rx="10" fill="#eef5fc" stroke="#365d7e"/>
  </g>
  <g font-family="sans-serif" font-size="20" fill="#172b3a">
    <text x="20" y="38" font-size="26" font-weight="bold">Detect offline sensors</text>
    <text x="40" y="105" font-weight="bold">Events for sensor-1</text>
    <text x="40" y="150">0.1 s: register sensor-1</text>
    <text x="40" y="195">1.1 s: clock event</text>
    <text x="40" y="240">1.3 s: reading 10</text>
    <text x="395" y="105" font-weight="bold">Check for 1 second of silence</text>
    <text x="395" y="150">Start waiting at registration.</text>
    <text x="395" y="195">No reading for 1 second: mark offline.</text>
    <text x="395" y="240">A new reading restores online status.</text>
    <text x="900" y="105" font-weight="bold">Availability updates</text>
    <text x="900" y="195" font-size="28">1.1 s: offline</text>
    <text x="900" y="240" font-size="28">1.3 s: online</text>
    <text x="20" y="310">Keep the clock publisher running so silence is detected even when no readings arrive.</text>
  </g>
</svg>
