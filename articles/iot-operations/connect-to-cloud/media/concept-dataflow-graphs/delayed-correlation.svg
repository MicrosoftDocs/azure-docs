<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Match predictions with delayed measurements by ID</title>
  <desc id="desc">One MQTT source subscribes to factory/predictions and factory/measurements. A custom ID matcher holds pending records, matches asset line-1 and piece part-42, calculates residual -3 and targetError 2, and preserves original prediction features. Results go to factory/matches. Either arrival order works. No built-in window is used.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#365d7e"/></marker>
  </defs>
  <rect width="1100" height="250" fill="#fff"/>
  <g fill="none" stroke="#365d7e" stroke-width="2" marker-end="url(#arrow)">
    <path d="M 250 65 H 275 V 105 H 300"/>
    <path d="M 250 185 H 275 V 145 H 300"/>
    <path d="M 475 125 H 520"/>
    <path d="M 750 125 H 795"/>
  </g>
  <g stroke-width="1.5">
    <rect x="20" y="25" width="230" height="80" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="20" y="145" width="230" height="80" rx="10" fill="#eef5fc" stroke="#365d7e"/>
    <rect x="300" y="75" width="175" height="100" rx="10" fill="#e7f3e8" stroke="#2e6943"/>
    <rect x="520" y="70" width="230" height="110" rx="10" fill="#f1eafa" stroke="#69518c"/>
    <rect x="795" y="70" width="285" height="110" rx="10" fill="#eef5fc" stroke="#365d7e"/>
  </g>
  <g font-family="sans-serif" font-size="16" fill="#172b3a" text-anchor="middle">
    <text x="135" y="59"><tspan x="135" font-weight="bold">Prediction: 203</tspan><tspan x="135" dy="24">line-1 / part-42</tspan></text>
    <text x="135" y="179"><tspan x="135" font-weight="bold">Measurement: 200</tspan><tspan x="135" dy="24">line-1 / part-42</tspan></text>
    <text x="387" y="107"><tspan x="387" font-weight="bold">MQTT source</tspan><tspan x="387" dy="24" font-size="13">factory/predictions</tspan><tspan x="387" dy="24" font-size="13">factory/measurements</tspan></text>
    <text x="635" y="102"><tspan x="635" font-weight="bold">CUSTOM ID matcher</tspan><tspan x="635" dy="26">Match asset and piece</tspan><tspan x="635" dy="24">Calculate errors</tspan></text>
    <text x="937" y="99"><tspan x="937" font-weight="bold">factory/matches</tspan><tspan x="937" dy="25">Residual: 200 - 203 = -3</tspan><tspan x="937" dy="25">targetError: 200 - 198 = 2</tspan></text>
    <text x="635" y="225">Either arrival order works</text>
  </g>
</svg>
