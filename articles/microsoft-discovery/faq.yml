### YamlMime:FAQ

metadata:
  title: Microsoft Discovery FAQ
  description: Answers to frequently asked questions about Microsoft Discovery, including product choices, architecture, deployment, security, research workflows, operations, billing, and automation.
  author: mukesh-dua
  ms.author: mukeshdua
  ms.service: azure
  ms.topic: faq
  ms.date: 09/23/2026
title: Microsoft Discovery FAQ
summary: |
  This article answers common questions about Microsoft Discovery. For procedures and specifications that can change over time, the answers link to the relevant source article in the [Microsoft Discovery documentation](https://learn.microsoft.com/en-us/azure/microsoft-discovery/).
sections:
- name: Overview and product choices
  questions:
  - question: What is Microsoft Discovery?
    answer: |
      Microsoft Discovery is an enterprise platform for scientific research and R&D workflows. It brings together agentic orchestration, advanced reasoning, a graph-based knowledge foundation, and high-performance computing. For an introduction, see [What is Microsoft Discovery?](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-what-is-microsoft-discovery).
  - question: Who is Microsoft Discovery designed for?
    answer: |
      Microsoft Discovery supports scientists who generate insights, developers who build and extend capabilities, administrators and IT teams who operate the platform, and organizational leaders responsible for research outcomes. See [What is Microsoft Discovery?](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-what-is-microsoft-discovery).
  - question: What is the difference between Microsoft Discovery and the Microsoft Discovery app?
    answer: |
      Microsoft Discovery is the Azure-hosted enterprise platform. The Microsoft Discovery app is a free, local experience that lets individual researchers begin AI-assisted discovery without deploying the Azure platform. For a comparison, see [Microsoft Discovery and the Microsoft Discovery app](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-and-discovery-app).
  - question: What is Microsoft Discovery Studio?
    answer: |
      Microsoft Discovery Studio is the web-based research environment for Microsoft Discovery. It is used to work with workspaces, projects, agents, shared sessions, knowledge bases, tools, and data. See [What is Microsoft Discovery Studio?](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-studio).
  - question: Is the Discovery Studio portal public or private?
    answer: |
      The Discovery Studio portal UI is publicly accessible over the internet, similar to the Azure portal, and is secured with Microsoft Entra ID authentication. Backend data isn't exposed through public endpoints. See [What is Microsoft Discovery Studio?](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-studio) and [Network security overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-network-security).
  - question: What scenarios are supported by Microsoft Discovery?
    answer: |
      Microsoft Discovery supports scientific and engineering workflows that combine organizational knowledge, data, models, computation, agents, and human review. For representative scenarios, see [Key scenarios](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-key-scenarios).
  - question: Is Microsoft Discovery primarily an offline optimization and prediction platform, or does it directly control physical scientific or manufacturing equipment in real time?
    answer: |
      Microsoft Discovery is an online platform with human oversight. Researchers can review, edit, and initiate runs as needed. Direct, real-time, closed-loop control of physical equipment is not documented as a generally available platform capability. See [Platform Card for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-platform-card) for intended uses and limitations.
- name: Core concepts and architecture
  questions:
  - question: What are the main Microsoft Discovery resources?
    answer: |
      The main concepts include workspaces, projects, shared sessions, agents, tasks, tools, models, Bookshelves and knowledge bases, storage containers and assets, supercomputers, and node pools. Start with [Service architecture overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-service-architecture) and [Microsoft Discovery projects and shared sessions](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-projects-investigations).
  - question: What is the difference between a workspace and a project?
    answer: |
      A workspace is the top-level environment that brings together platform resources. A project is an access and organizational boundary within a workspace for a specific body of research. See [Microsoft Discovery projects and shared sessions](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-projects-investigations).
  - question: What is a shared session?
    answer: |
      A shared session is the collaborative research context in which people, agents, tasks, files, and execution history are organized for an investigation. See [Microsoft Discovery projects and shared sessions](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-projects-investigations).
  - question: What is a task?
    answer: |
      A task is a unit of work within a shared session. Tasks can include dependencies, status, comments, execution history, and results. See [Tasks and shared sessions](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-tasks-investigations).
  - question: What Azure resources are created when a Microsoft Discovery workspace is provisioned?
    answer: |
      Provisioning a workspace creates a dedicated managed resource group in your subscription for backend resources. Other system-managed resource groups can also appear. Bookshelves and supercomputers are provisioned separately and have their own managed resource groups. See [Service architecture overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-service-architecture).
  - question: In whose subscription are the resources deployed?
    answer: |
      Microsoft Discovery resources and their supporting Azure infrastructure are deployed in the customer's Azure subscription, not a Microsoft-managed subscription. See [Service architecture overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-service-architecture).
  - question: Is Azure Container Registry required?
    answer: |
      No. Azure Container Registry is optional and is needed when you bring container images for custom tools that run on the supercomputer. See [Microsoft Discovery tools and model integration](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-tools-model-integration).
- name: Getting access and preparing Azure
  questions:
  - question: What must be prepared before deploying Microsoft Discovery?
    answer: |
      Prepare an Azure subscription, register the required resource providers, assign the required roles, reserve required service and model quota, and validate regional and networking requirements. Start with [Quickstart: Deploy Microsoft Discovery infrastructure](https://learn.microsoft.com/en-us/azure/microsoft-discovery/quickstart-infrastructure), [Resource provider registration](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-resource-provider-registration), and [Quota reservations](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-quota-reservation).
  - question: How do I register the Azure resource providers that Microsoft Discovery needs?
    answer: |
      Use the supported registration methods described in [Microsoft Discovery resource provider registration](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-resource-provider-registration). The article covers the required permissions and registration through the Azure portal, Azure CLI, Azure PowerShell, and REST API.
  - question: What quota does Microsoft Discovery require?
    answer: |
      Microsoft Discovery requires quota across multiple Azure services, including the models and compute used by the deployment. Requirements depend on the resources you deploy. Review the current requirements in [Quota reservations for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-quota-reservation).
  - question: Which regions support Microsoft Discovery?
    answer: |
      Region availability and cross-region deployment guidance can change. Review the current region information in [Service architecture overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/overview-service-architecture) and the deployment guidance in [Quickstart: Deploy Microsoft Discovery infrastructure](https://learn.microsoft.com/en-us/azure/microsoft-discovery/quickstart-infrastructure).
  - question: What is the Discovery Toolbox, and how do I get it?
    answer: |
      The Discovery Toolbox is a Visual Studio Code extension for setting up, validating, managing, monitoring, and removing Microsoft Discovery infrastructure. Installation and release information is maintained in the public [Discovery Toolbox directory](https://github.com/microsoft/discovery/tree/main/utilities/discovery-toolbox).
  - question: How do I grant users the roles they need for Microsoft Discovery?
    answer: |
      Assign the platform, project, and supporting Azure resource roles required for each user persona. Follow [Role assignments in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-role-assignments) and [Configure project-level access](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-project-rbac).
- name: Deployment and lifecycle management
  questions:
  - question: How do I deploy Microsoft Discovery?
    answer: |
      Follow [Quickstart: Deploy Microsoft Discovery infrastructure](https://learn.microsoft.com/en-us/azure/microsoft-discovery/quickstart-infrastructure). It is the source of truth for current prerequisites, deployment inputs, and validation steps.
  - question: Can I manage a workspace after it is created?
    answer: |
      Yes. Workspace operations and currently supported configuration changes are documented in [Manage workspaces in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-manage-workspaces).
  - question: How do I manage supercomputers and node pools?
    answer: |
      Use the Azure portal procedures in [Manage supercomputers and node pools](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-manage-supercomputers).
  - question: Does Microsoft Discovery provide built-in backup or disaster recovery?
    answer: |
      Microsoft Discovery doesn't currently provide built-in automatic failover or disaster recovery. If your organization requires additional resiliency, design replication and backup for the applicable stateful resources and consider a multi-region deployment. See [Business continuity and disaster recovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-business-continuity-disaster-recovery).
  - question: How do I delete a Microsoft Discovery deployment?
    answer: |
      Discovery resources have parent-child and cross-resource dependencies and must be removed in the correct order. Use the current procedure and supported deletion utility described in [Delete Microsoft Discovery resources](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-delete-discovery-resources) instead of relying on a copied deletion sequence in this FAQ.
  - question: Why can't I delete a Discovery resource or resource group?
    answer: |
      A dependent child resource, resource link, subnet delegation, private endpoint connection, or workspace-to-supercomputer association can block deletion. Follow [Delete Microsoft Discovery resources](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-delete-discovery-resources) for the current dependency order and remediation guidance.
- name: Identity and access management
  questions:
  - question: How does Microsoft Discovery control access?
    answer: |
      Microsoft Discovery uses Azure role-based access control for platform, project, and resource access. See [Role assignments in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-role-assignments).
  - question: Can I grant access to one project without granting access to the entire workspace?
    answer: |
      Yes. Project-level access control makes a project an access boundary within a shared workspace. See [Project-level access control](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-project-rbac) and [Configure project-level access](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-project-rbac).
  - question: How do project roles interact with shared resources?
    answer: |
      Project access and access to shared resources are evaluated separately. A user can require supplementary permissions to use shared tools, models, storage, or knowledge resources. See [Project-level access control](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-project-rbac).
  - question: Why does Microsoft Discovery use managed identities?
    answer: |
      Microsoft Discovery uses user-assigned managed identities to authenticate to Azure resources on behalf of workspaces, supercomputers, and Bookshelves. See [Configure managed identities for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-managed-identity).
  - question: How do I configure managed identities?
    answer: |
      Follow [Configure managed identities for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-managed-identity) for current creation, association, and Azure role-assignment requirements.
- name: Networking, security, and compliance
  questions:
  - question: Are Discovery services exposed publicly or privately?
    answer: |
      Most backend resources use private connectivity controls such as private endpoints, Network Security Perimeter, and virtual network integration. Review the current design in [Network security overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-network-security).
  - question: How do I turn on network isolation for a workspace?
    answer: |
      Configure network isolation during workspace deployment or update by following [Configure network security](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-network-security). The article is the source of truth for current properties and prerequisites.
  - question: What subnets does a hardened deployment need?
    answer: |
      A hardened deployment uses dedicated networking for applicable workspace, agent, private endpoint, Bookshelf, and supercomputer components. Required subnet roles and sizing can change, so use [End-to-end network-hardened deployment](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-deploy-network-hardened-stack) and [Configure network security](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-network-security).
  - question: Do I need to allow inbound access from Microsoft into my environment?
    answer: |
      No explicit customer-configured inbound access from Microsoft is required for the architecture described in the Discovery network-security guidance. See [Network security overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-network-security).
  - question: Does Microsoft Discovery support customer-managed keys?
    answer: |
      Yes, for the resources and scenarios documented by the service. See [Configure customer-managed keys](https://learn.microsoft.com/en-us/azure/microsoft-discovery/howto-data-encryption-at-rest) for current scope and prerequisites.
  - question: Where can I find compliance guidance?
    answer: |
      Start with [Security and compliance overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-security-overview), [Compliance guidance](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-compliance-framework-mappings), and the [SIG-based security and compliance FAQ](https://learn.microsoft.com/en-us/azure/microsoft-discovery/faq-security-compliance-sig).
- name: Agents, models, and Discovery Engine
  questions:
  - question: How are Discovery agents implemented?
    answer: |
      Discovery agents are configured as Microsoft Discovery resources and use the platform's agent and workflow infrastructure to perform assigned work. For the current architecture and supported agent types, see [Discovery Agent concepts](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-agent) and [Discovery Agent types](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-agent-types).
  - question: How do I create an agent?
    answer: |
      Follow [Create agents](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-agent-creation) for current prerequisites, configuration fields, and supported creation paths.
  - question: Which models does Microsoft Discovery require?
    answer: |
      Required models and quota can vary across Discovery Engine, agents, and Bookshelf. Review the current model and quota requirements in [Quota reservations for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-quota-reservation).
  - question: Can I choose which models my agents use?
    answer: |
      Yes, within the models and configurations supported by Microsoft Discovery. See [Select models for agents](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-select-models-for-agents).
  - question: Where can custom models run?
    answer: |
      Documented integration patterns include models hosted in Azure Machine Learning and containerized models run through supercomputer-backed tools. See [Microsoft Discovery tools and model integration](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-tools-model-integration).
  - question: What is the Discovery Engine?
    answer: |
      The Discovery Engine is the cognitive orchestration layer that plans research work, delegates tasks, monitors progress, and adapts execution. See [Discovery Engine overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-engine).
  - question: What is cognition?
    answer: |
      Cognition is the Discovery Engine capability that reasons over the research objective, available agents, tasks, evidence, validation requirements, and execution state. See [Cognition overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-cognition-overview).
  - question: How much autonomy does the Discovery Engine have?
    answer: |
      The level of autonomy depends on how the shared session, tasks, and validation requirements are configured. Researchers remain responsible for setting direction and reviewing results. See [Trust relationship and basic shared session patterns](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-trust-basic-investigation-patterns).
  - question: How do I run my first agent and investigation?
    answer: |
      Follow [Run your first agent and investigation](https://learn.microsoft.com/en-us/azure/microsoft-discovery/quickstart-agents-studio).
  - question: How do I build a shared session that uses cognition?
    answer: |
      Follow [Build shared sessions with cognition](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-build-investigations-cognition).
- name: Tools, compute, and integrations
  questions:
  - question: What is the supercomputer in Microsoft Discovery?
    answer: |
      The supercomputer is the compute abstraction used by Microsoft Discovery for applicable tool, model, and knowledge-processing workloads. Its current implementation and management model are described in [Manage supercomputers and node pools](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-manage-supercomputers).
  - question: Which VM families can I use for supercomputer node pools?
    answer: |
      Supported VM families and node-pool requirements can change by region and release. Use [Manage supercomputers and node pools](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-manage-supercomputers) and [Quota reservations](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-quota-reservation) as the current sources of truth.
  - question: What kinds of tools can agents use?
    answer: |
      Microsoft Discovery supports the tool types and execution patterns described in [Microsoft Discovery tools and model integration](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-tools-model-integration).
  - question: How should I plan a custom tool?
    answer: |
      Define the tool's function, compute requirements, dependencies, packaging, and integration pattern before publishing it. See [Plan tool requirements](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-plan-tool-requirements).
  - question: How do tools authenticate to Azure resources?
    answer: |
      Use the identity and role-assignment patterns supported for the applicable Discovery resource and tool configuration. See [Configure managed identities](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-configure-managed-identity) and [Microsoft Discovery tools and model integration](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-tools-model-integration).
  - question: How do I submit jobs directly to the supercomputer?
    answer: |
      Use the supported supercomputer command-line utility described in the public [Supercomputer CLI directory](https://github.com/microsoft/discovery/tree/main/utilities/supercomputer-cli). Refer to its current README for prerequisites and command syntax.
  - question: Where can I find utilities to operate a Microsoft Discovery deployment?
    answer: |
      The public [Microsoft Discovery utilities directory](https://github.com/microsoft/discovery/tree/main/utilities) contains the currently published operator utilities and their documentation, including setup and lifecycle tools.
- name: Data, knowledge, and research artifacts
  questions:
  - question: What are storage containers and storage assets?
    answer: |
      A storage container represents a connection to storage used by a workspace, while storage assets identify data that agents can use. See [Storage containers and storage assets](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-storage-containers-assets).
  - question: What is a Bookshelf knowledge base?
    answer: |
      A Bookshelf knowledge base organizes and indexes a curated corpus so that researchers and agents can query connected scientific knowledge. See [Bookshelf and Knowledge Bases](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-bookshelf-knowledge-bases).
  - question: What is the difference between Bookshelf and Azure AI Search?
    answer: |
      Bookshelf is designed for graph-based, thematic, and multi-hop reasoning across a curated corpus. Azure AI Search is suited to scalable indexing and precise retrieval. Use the comparison and limits in [Bookshelf and Knowledge Bases](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-bookshelf-knowledge-bases) when selecting an approach.
  - question: Which retrieval approach should I use?
    answer: |
      Use the retrieval approach that matches the question and corpus. Bookshelf is intended for connected, discovery-oriented reasoning, while search indexing is appropriate for targeted retrieval at larger scale. See [Bookshelf and Knowledge Bases](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-bookshelf-knowledge-bases).
  - question: Can Bookshelf handle a 100-GB corpus directly?
    answer: |
      Bookshelf is intended for a curated corpus rather than indiscriminate ingestion of a very large repository. Review the current size guidance and limitations in [Bookshelf and Knowledge Bases](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-bookshelf-knowledge-bases).
  - question: What document types does Bookshelf support?
    answer: |
      Supported document types and ingestion limitations can change. Use [Create and index a Bookshelf Knowledge Base](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-index-bookshelf-knowledgebase) as the source of truth.
  - question: Do scientists always need an agent to query a Bookshelf?
    answer: |
      No. A Bookshelf can be queried directly, and it can also be used as grounding within agent-driven research. See [Bookshelf and Knowledge Bases](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-bookshelf-knowledge-bases).
  - question: Where are files generated by agents stored?
    answer: |
      Files produced during shared-session tasks are represented as research artifacts and can be made available to related tasks according to the documented file and inheritance model. See [Files and storage assets](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-files-storage-assets).
  - question: How does data move between tools and agents?
    answer: |
      Data handling depends on the configured storage assets, tools, task artifacts, and agent instructions. See [Data handling with tools and agents](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-data-handling-with-tools-agents) and [Files and storage assets](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-files-storage-assets).
- name: Studio and research workflows
  questions:
  - question: How do I access Discovery Studio?
    answer: |
      Access and browser requirements are documented in [What is Microsoft Discovery Studio?](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-studio). Your account must also have the required Discovery and Azure permissions.
  - question: How do researchers collaborate in Discovery?
    answer: |
      Researchers collaborate through projects and shared sessions that organize tasks, comments, files, execution history, agents, and results. See [Microsoft Discovery projects and shared sessions](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-projects-investigations).
  - question: How are task results and execution history preserved?
    answer: |
      Tasks maintain status, comments, execution attempts, and results within the shared-session model. See [Tasks and shared sessions](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-tasks-investigations).
  - question: Can I use GitHub Copilot in Discovery Studio?
    answer: |
      Yes, where the documented preview and workspace configuration requirements are met. See [Use GitHub Copilot in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-copilot).
  - question: How should I write prompts for Discovery agents?
    answer: |
      Use clear objectives, constraints, expected outputs, relevant context, and validation criteria. See [Write effective prompts for agents](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-prompt-engineering).
- name: Operations, monitoring, and troubleshooting
  questions:
  - question: What observability does Microsoft Discovery provide?
    answer: |
      Microsoft Discovery integrates with Azure Monitor and provides platform-specific logging for applicable workspace, supercomputer, and control-plane operations. See [Observability in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-observability).
  - question: How do I view Azure activity logs for Discovery resources?
    answer: |
      Follow [View activity logs for Microsoft Discovery resources](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-view-activity-logs).
  - question: How do I query workspace logs?
    answer: |
      Use the Log Analytics workspace associated with the workspace's managed resource group and follow [Query workspace logs](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-query-workspace-logs).
  - question: How do I query supercomputer logs?
    answer: |
      Use the applicable Log Analytics workspace and the queries documented in [Query supercomputer logs](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-query-supercomputer-logs).
  - question: How do I enable audit logging?
    answer: |
      Configure Azure Monitor diagnostic settings as described in [Enable audit logging for Microsoft Discovery resources](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-enable-audit-logging).
  - question: How do I trace a failed request?
    answer: |
      Use the correlation ID and the relevant workspace, supercomputer, or activity logs. See [Observability in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-observability), [Query workspace logs](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-query-workspace-logs), and [Query supercomputer logs](https://learn.microsoft.com/en-us/azure/microsoft-discovery/how-to-query-supercomputer-logs).
  - question: What information should I collect before requesting support?
    answer: |
      Collect the affected resource IDs, operation time, correlation ID, error text, deployment region, and relevant activity or application logs. Use [Observability in Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-observability) to locate the available diagnostics.
- name: Billing and cost management
  questions:
  - question: Who pays for the Azure infrastructure?
    answer: |
      The customer pays for the supporting Azure resources deployed in the customer's subscription. See [Microsoft Discovery billing overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-billing).
  - question: How is Microsoft Discovery billed?
    answer: |
      The Discovery app and Azure-hosted Microsoft Discovery services have different pricing models. Billable service operations and supporting Azure infrastructure charges are described in [Microsoft Discovery billing overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-billing).
  - question: Is the Microsoft Discovery app free?
    answer: |
      The Discovery app is described as a free local edition. Check [Microsoft Discovery and the Microsoft Discovery app](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-and-discovery-app) and [Microsoft Discovery billing overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-billing) for current terms.
  - question: Which resources contribute to cost?
    answer: |
      Costs can include the Microsoft Discovery service and the Azure resources used for models, storage, databases, networking, monitoring, and compute. See [Microsoft Discovery billing overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-billing).
  - question: How can I monitor deployment cost?
    answer: |
      Use Azure Cost Management for resources in the customer subscription and the cost capabilities documented for the Discovery tooling. See [Microsoft Discovery billing overview](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-discovery-billing) and the public [Microsoft Discovery GitHub repository](https://github.com/microsoft/discovery).
- name: Responsible AI and supported use
  questions:
  - question: Is Microsoft Discovery intended to replace scientific review?
    answer: |
      No. Microsoft Discovery is designed to support scientific work with human oversight. Researchers remain responsible for reviewing evidence, validating outputs, and deciding how results are used. See [Platform Card for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-platform-card).
  - question: What are the intended uses and limitations of Microsoft Discovery?
    answer: |
      The intended uses, limitations, evaluations, safety components, and responsible-use guidance are documented in [Platform Card for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-platform-card).
  - question: How should users validate agent-generated results?
    answer: |
      Define validation requirements, review evidence and artifacts, and calibrate autonomy to the risk and purpose of the research. See [Trust relationship and basic shared session patterns](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-trust-basic-investigation-patterns) and [Platform Card for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-platform-card).
  - question: Does Microsoft Discovery guarantee that generated conclusions are correct?
    answer: |
      No. Agent and model outputs require human review and validation. See [Platform Card for Microsoft Discovery](https://learn.microsoft.com/en-us/azure/microsoft-discovery/concept-platform-card) for documented limitations and responsible-use guidance.
- name: APIs, automation, and developer reference
  questions:
  - question: Can Microsoft Discovery resources be managed programmatically?
    answer: |
      Yes. Microsoft Discovery provides REST API reference and Azure CLI coverage for supported resource-management operations. See the [Microsoft Discovery REST API reference](https://learn.microsoft.com/en-us/rest/api/discovery/) and [Microsoft Discovery Azure CLI reference](https://learn.microsoft.com/en-us/cli/azure/service-page/microsoft%20discovery?view=azure-cli-latest).
  - question: Can I automate deployment with infrastructure as code?
    answer: |
      Use the deployment templates and automation maintained in the supported Microsoft Discovery documentation and public repository. Start with [Quickstart: Deploy Microsoft Discovery infrastructure](https://learn.microsoft.com/en-us/azure/microsoft-discovery/quickstart-infrastructure) and the [Microsoft Discovery GitHub repository](https://github.com/microsoft/discovery).
  - question: Where are Microsoft Discovery API versions documented?
    answer: |
      Use the [Microsoft Discovery REST API reference](https://learn.microsoft.com/en-us/rest/api/discovery/) for supported operations, schemas, and API versions.
  - question: Where can I find command-line reference?
    answer: |
      See the [Microsoft Discovery Azure CLI reference](https://learn.microsoft.com/en-us/cli/azure/service-page/microsoft%20discovery?view=azure-cli-latest) and the operator utilities in the [Microsoft Discovery GitHub repository](https://github.com/microsoft/discovery).
