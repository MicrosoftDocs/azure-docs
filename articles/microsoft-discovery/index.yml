### YamlMime:Landing

title: Microsoft Discovery documentation
summary: Microsoft Discovery is an extensible platform that brings together agentic orchestration, advanced reasoning, a graph-based knowledge foundation, and high-performance computing for scientific research and R&D workflows. These articles cover the Microsoft Discovery enterprise platform unless otherwise noted, visit GitHub for app-specific guidance.

