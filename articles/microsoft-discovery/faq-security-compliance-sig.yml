### YamlMime:FAQ

metadata:
  title: Microsoft Discovery SIG-based security and compliance FAQ
  description: Answers to common security and compliance questions about Microsoft Discovery, organized by the Standardized Information Gathering (SIG) questionnaire risk domains.
  author: yousefi-msft
  ms.author: yousefi
  ms.service: azure
