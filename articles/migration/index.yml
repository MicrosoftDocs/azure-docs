### YamlMime:ProductSubHub
metadata:
  title: Azure Migration and Modernization Hub
  description: Step-by-step guidance for migrating workloads to Azure from on-premises environments, Amazon Web Services (AWS), or Google Cloud.
  ms.topic: hub-page
  ms.service: azure-migrate
  ms.date: 09/09/2026
  ms.collection:
    - migration
  ms.custom: migration-hub
  ms.author: rhackenberg
  author: reginahack
  ms.reviewer: rhackenberg, chkittel

title: Azure Migration and Modernization Hub
brand: azure

# Ref: https://learn.microsoft.com/static/ui/latest/schemas/ProductSubHub.schema.json
# Single-TOC variant (tocType: single). Required sections: productOverview, getStarted,
# coreWorkflows. The multi-TOC-only allProductAreas section is not used here.

tocType: single

# ------------------------------------------------------------------------------
# Section 1: Product overview (required): text only, no cards or links
# ------------------------------------------------------------------------------
productOverview:
  title: Azure Migration and Modernization Hub
  summary: Move workloads to Azure from on-premises environments, Amazon Web Services, or Google Cloud. Follow the Plan, Prepare, Execute, Evaluate, and Decommission model to assess, migrate, and retire your source environment with confidence.

# ------------------------------------------------------------------------------
# Section 2: Get started (required): 1 to 4 entry-point cards
# ------------------------------------------------------------------------------
getStarted:
  title: Where are you migrating from?
  summary: Choose your source environment to see migration guidance specific to your platform.
  items:
    - title: Migrate from on-premises
      description: Migration guidance for datacenters, VMware, Hyper-V, physical servers, and databases.
      url: /azure/migration/migrate-from-on-premises
    - title: Migrate from Amazon Web Services (AWS)
      description: Service comparisons and step-by-step migration scenarios organized by workload type.
      url: /azure/migration/migrate-from-aws
    - title: Migrate from Google Cloud
      description: Service comparisons and migration scenarios for compute and database workloads.
      url: /azure/migration/migrate-from-google-cloud
    - title: Migrate workloads to Azure
      description: Migration strategies, migration journey in five phases, and migration guidance.
      url: /azure/migration/migrate-to-azure

# ------------------------------------------------------------------------------
# Section 3: Core workflows (required for single-TOC): 2 to 24 task cards,
# each with a title, description, and up to 3 links.
# ------------------------------------------------------------------------------



coreWorkflows:
  title: Scenarios, tools and troubleshooting
  summary: Tools and guidance for every stage of your migration journey.
  items:
    - icon:
        src: /media/hubs/shared/assessment-checkmark-gradient.svg
      title: Adopt Azure
      description: Assess workloads, build a migration plan, and prepare your Azure environment before you begin.
      links:
        - text: Migration planning and prioritization
          url: /azure/cloud-adoption-framework/migrate/plan-migration
        - text: Deploy a landing zone
          url: /azure/cloud-adoption-framework/ready/landing-zone
        - text: Configure identity and access
          url: /azure/cloud-adoption-framework/ready/landing-zone/design-area/identity-access   
    - icon:
        src: /media/hubs/shared/architecture-yellow.svg
      title: Design and govern for Azure
      description: Design and implement governance for your Azure environment to ensure compliance, security, and operational efficiency.
      links:
      - text: Design well architected solutions
        url: /azure/well-architected/pillars
      - text: Architect and build workloads
        url: /azure/architecture/
      - text: Governance and compliance frameworks for Azure
        url: /azure/governance/management-groups/azure-management
    - icon:
        src: /media/hubs/shared/code-sample-square-magenta.svg
      title: Use migration tools
      description: Discover and assess workloads, estimate costs, and run migrations with dedicated Azure tools.
      links:
        - text: Azure Migrate
          url: /azure/migrate/
        - text: Azure Resource Inventory (ARI)
          url: https://github.com/microsoft/ARI
    - icon:
        src: /media/hubs/shared/q-and-a-orange.svg
      title: Troubleshooting
      description: Find solutions to common challenges and get guidance for troubleshooting issues.
      links:
        - text: Azure troubleshooting documentation
          url: /troubleshoot/azure/

# ------------------------------------------------------------------------------
# Section 4: Support and reference (optional): 2 to 4 lightweight cards.
# ------------------------------------------------------------------------------
supportReference:
  title: Frameworks and reference
  summary: Architecture guidance and community resources for Azure migration.
  items:
    - icon:
        src: /media/hubs/shared/documentation-purple.svg
      title: Cloud Adoption Framework for Azure
      url: /azure/cloud-adoption-framework/
    - icon:
        src: /media/hubs/shared/architecture-yellow.svg
      title: Azure Well-Architected Framework
      url: /azure/well-architected/
    - icon:
        src: /media/hubs/shared/architecture-yellow.svg
      title: Azure Architecture Center
      url: /azure/architecture/
    - icon:
        src: /media/hubs/shared/documentation-purple.svg
      title: Azure Migration and Modernization Blog
      url: https://techcommunity.microsoft.com/category/azure/blog/azuremigrationblog
