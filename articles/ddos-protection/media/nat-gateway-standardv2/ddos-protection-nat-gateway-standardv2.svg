<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="790" viewBox="0 0 1420 790" role="img" aria-labelledby="diagram-title diagram-description">
  <title id="diagram-title">DDoS protection for NAT Gateway StandardV2</title>
  <desc id="diagram-description">Workloads in a subnet connect outbound through a StandardV2 NAT gateway and a StandardV2 public IP to the internet. Choose Network Protection on the virtual network or IP Protection on the individual public IP. Custom policy is not supported in this preview. Dashed lines indicate configuration scope and are not traffic paths.</desc>
  <defs><marker id="outbound-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#0078D4"/></marker></defs>
  <rect width="1420" height="790" fill="#ffffff"/>
  <rect x="40" y="260" width="660" height="310" rx="10" fill="none" stroke="#0078D4" stroke-width="2"/>
  <rect x="60" y="330" width="275" height="215" rx="10" fill="none" stroke="#0078D4" stroke-width="2"/>
  <rect x="60" y="110" width="600" height="110" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <rect x="85" y="385" width="225" height="120" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <rect x="415" y="385" width="250" height="120" rx="10" fill="#FFF4CE" stroke="#F7630C" stroke-width="2"/>
  <rect x="805" y="385" width="240" height="120" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <rect x="1190" y="385" width="180" height="120" rx="10" fill="#CFE4FA" stroke="#0078D4" stroke-width="2"/>
  <rect x="760" y="590" width="610" height="100" rx="10" fill="#DFF6DD" stroke="#107C10" stroke-width="2"/>
  <line x1="310" y1="445" x2="415" y2="445" stroke="#0078D4" stroke-width="2" marker-end="url(#outbound-arrow)"/>
  <line x1="665" y1="445" x2="805" y2="445" stroke="#0078D4" stroke-width="2" marker-end="url(#outbound-arrow)"/>
  <line x1="1045" y1="445" x2="1190" y2="445" stroke="#0078D4" stroke-width="2" marker-end="url(#outbound-arrow)"/>
  <line x1="360" y1="220" x2="360" y2="260" stroke="#107C10" stroke-width="2" stroke-dasharray="8 6"/>
  <line x1="925" y1="505" x2="925" y2="590" stroke="#107C10" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="360" y="158" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">Option 1: Network Protection</text>
  <text x="360" y="185" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">Configured on the virtual network</text>
  <text x="197.5" y="438" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">Application</text>
  <text x="197.5" y="465" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">workloads</text>
  <text x="540" y="438" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">NAT Gateway</text>
  <text x="540" y="465" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">StandardV2</text>
  <text x="925" y="438" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">StandardV2</text>
  <text x="925" y="465" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">public IP</text>
  <text x="1280" y="451.5" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">Internet</text>
  <text x="1065" y="633" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">Option 2: IP Protection</text>
  <text x="1065" y="660" text-anchor="middle" fill="#000000" font-family="Arial, sans-serif" font-size="20">Configured on the individual public IP</text>
  <text x="40" y="48" fill="#000000" font-family="Arial, sans-serif" font-size="30">DDoS protection for NAT Gateway StandardV2</text>
  <text x="40" y="88" fill="#000000" font-family="Arial, sans-serif" font-size="18">Public preview | StandardV2 IPv4 and IPv6 public IP addresses</text>
  <text x="65" y="300" fill="#000000" font-family="Arial, sans-serif" font-size="22">Virtual network (logical resource association)</text>
  <text x="85" y="365" fill="#000000" font-family="Arial, sans-serif" font-size="20">Workload subnet</text>
  <text x="420" y="339" fill="#000000" font-family="Arial, sans-serif" font-size="16">Subnet association required</text>
  <text x="40" y="720" fill="#000000" font-family="Arial, sans-serif" font-size="16">Solid arrows: outbound connectivity. Dashed lines: configuration scope, not traffic.</text>
  <text x="760" y="720" fill="#000000" font-family="Arial, sans-serif" font-size="16">Custom policy is not supported in this preview.</text>
  <text x="40" y="751" fill="#000000" font-family="Arial, sans-serif" font-size="16">Protection doesn't enable unsolicited inbound connections. Standard SKU NAT Gateway isn't supported.</text>
</svg>
