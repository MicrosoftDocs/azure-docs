### YamlMime:Landing

title: Resiliency documentation
summary: Resiliency in Azure (formerly Azure Business Continuity Center) unifies infrastructure resiliency, data protection, and cyber recovery. Use Infrastructure Resiliency Manager's management and AI-assisted experiences to Start Resilient, Get Resilient, and Stay Resilient.

metadata:
  title: Resiliency Documentation
  description: Explore infrastructure resiliency through Start Resilient, Get Resilient, and Stay Resilient journeys, alongside data protection and cyber recovery in Azure.
  ms.service: resiliency
  ms.custom:
    - ignite-2023
    - ignite-2024
  ms.topic: landing-page
  author: AbhishekMallick-MS
