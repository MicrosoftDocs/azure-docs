sections:
  - name: Azure API for FHIR deprecation
    questions:
      - question: |
          What changed after Azure API for FHIR was deprecated?
        answer: |
          Azure API for FHIR was deprecated on **September 30, 2026**. You can no longer perform any API operations except `$export`.

          Customer data will be retained for **90 days after the service deprecation date**, with `$export` available throughout this period to export retained data.

          Blocked requests return HTTP **410 Gone** with an *OperationOutcome* resource that explains that the FHIR service is retired.
