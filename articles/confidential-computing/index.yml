### YamlMime:Landing

title: Azure confidential computing
summary: Azure confidential computing offers solutions to isolate sensitive data while it is being processed. Explore AMD SEV-SNP and Intel TDX VMs, confidential containers, and first-party services, with specialized Intel SGX application enclaves for enclave-specific workloads.

