### YamlMime:Landing

title: Azure in China Playbook
summary: This playbook is for Azure customers and partners who are preparing to move workloads from Azure global to Azure in China, and who need to understand the local regulations in China and differences in sovereign cloud infrastructure. The playbook gives you background information, but you should still conduct due diligence on business regulations, and seek independent legal advice where appropriate.

