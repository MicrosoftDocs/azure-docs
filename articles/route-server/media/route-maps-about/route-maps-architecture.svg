<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1355 773" width="1355" height="773" role="img" aria-labelledby="svgTitle svgDesc" font-family="'Segoe UI', 'Segoe UI Web (West European)', 'Segoe UI Web', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif">
  <title id="svgTitle">Azure Route Server route maps architecture</title>
  <desc id="svgDesc">Diagram showing BGP peers on the left sending routes into Azure Route Server, where an inbound route map with MATCH, SET, and PERMIT or DENY stages processes received routes before they are advertised to virtual networks, and an outbound route map with the same stages processes routes before they are advertised to BGP peers on the right.</desc>

  <defs>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1B5EAB"/></marker>
    <marker id="aGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3F8F44"/></marker>
    <marker id="aRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#D83B01"/></marker>
    <marker id="aPurple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E6FC0"/></marker>

    <g id="arrows4">
      <circle r="12.5" fill="#1B72C4"/>
      <path d="M0,-9.6 L3.4,-5.6 L1.45,-5.6 L1.45,5.6 L3.4,5.6 L0,9.6 L-3.4,5.6 L-1.45,5.6 L-1.45,-5.6 L-3.4,-5.6 Z" fill="#A5DFF5"/>
      <path d="M-9.6,0 L-5.6,-3.4 L-5.6,-1.45 L5.6,-1.45 L5.6,-3.4 L9.6,0 L5.6,3.4 L5.6,1.45 L-5.6,1.45 L-5.6,3.4 Z" fill="#ffffff"/>
    </g>

    <g id="bldg">
      <rect x="-17" y="-20" width="34" height="40" rx="1.5" fill="#ffffff" stroke="#5A6270" stroke-width="1.5"/>
      <g fill="#5A6270">
        <rect x="-12" y="-15" width="6" height="6"/><rect x="-3" y="-15" width="6" height="6"/><rect x="6" y="-15" width="6" height="6"/>
        <rect x="-12" y="-5" width="6" height="6"/><rect x="-3" y="-5" width="6" height="6"/><rect x="6" y="-5" width="6" height="6"/>
        <rect x="-12" y="5" width="6" height="6"/><rect x="6" y="5" width="6" height="6"/>
      </g>
    </g>

    <g id="fw">
      <rect x="-17" y="-20" width="34" height="40" rx="1.5" fill="#ffffff" stroke="#5A6270" stroke-width="1.5"/>
      <g stroke="#5A6270" stroke-width="1.2">
        <path d="M-17,-10 H17 M-17,0 H17 M-17,10 H17"/>
        <path d="M-6,-20 V-10 M6,-10 V0 M-6,0 V10 M6,10 V20"/>
      </g>
    </g>

    <g id="cloud">
      <path d="M-20,7 a9,9 0 0,1 3,-17.5 a12,12 0 0,1 22.5,2 a8.5,8.5 0 0,1 -1.5,15.5 z" fill="#5BC5F2"/>
    </g>

    <g id="vnetIcon" fill="none" stroke="#1BA0E8" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <path d="M-15,-9 L-24,0 L-15,9"/>
      <path d="M15,-9 L24,0 L15,9"/>
      <g stroke="none" fill="#1BA0E8"><circle cx="-8" cy="0" r="2.7"/><circle cx="0" cy="0" r="2.7"/><circle cx="8" cy="0" r="2.7"/></g>
    </g>

    <g id="funnel"><path d="M0,0 L15,0 L9.2,7 L9.2,14 L5.8,16 L5.8,7 Z" fill="#4E9A51"/></g>

    <g id="gear" fill="none" stroke="#3A3A3A" stroke-width="1.7">
      <circle r="4.6"/>
      <path d="M0,-9 V-6.4 M0,6.4 V9 M-9,0 H-6.4 M6.4,0 H9 M-6.4,-6.4 L-4.6,-4.6 M4.6,4.6 L6.4,6.4 M6.4,-6.4 L4.6,-4.6 M-4.6,4.6 L-6.4,6.4"/>
    </g>

    <g id="okCircle"><circle r="8.5" fill="#ffffff" stroke="#4E9A51" stroke-width="1.6"/><path d="M-4,0.3 L-1.3,3 L4.2,-2.8" fill="none" stroke="#4E9A51" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></g>
    <g id="noCircle"><circle r="8.5" fill="#ffffff" stroke="#D83B01" stroke-width="1.6"/><path d="M-3.4,-3.4 L3.4,3.4 M3.4,-3.4 L-3.4,3.4" fill="none" stroke="#D83B01" stroke-width="1.9" stroke-linecap="round"/></g>
  </defs>

  <rect width="1355" height="773" fill="#ffffff"/>

  <!-- ============ Left column: BGP speakers ============ -->
  <g fill="#1B5EAB" font-size="13.5" font-weight="600">
    <text x="10" y="42">On-premises / NVA / Peers</text>
    <text x="10" y="60">(BGP Speakers)</text>
  </g>

  <rect x="8" y="100" width="182" height="84" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#bldg" transform="translate(42,130)"/>
  <use href="#arrows4" transform="translate(44,150)"/>
  <text x="92" y="118" font-size="12.5" font-weight="600" fill="#1F1F1F">On-premises</text>
  <text x="92" y="134" font-size="12.5" font-weight="600" fill="#1F1F1F">Network</text>
  <text x="92" y="150" font-size="11" fill="#555555">(Customer Edge)</text>

  <rect x="8" y="208" width="182" height="84" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#fw" transform="translate(42,240)"/>
  <use href="#arrows4" transform="translate(44,260)"/>
  <text x="92" y="243" font-size="12.5" font-weight="600" fill="#1F1F1F">NVA / Firewall</text>
  <text x="92" y="259" font-size="11" fill="#555555">(BGP Speaker)</text>

  <rect x="8" y="340" width="182" height="90" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#cloud" transform="translate(42,370)"/>
  <use href="#arrows4" transform="translate(44,387)"/>
  <text x="92" y="365" font-size="12.5" font-weight="600" fill="#1F1F1F">Cloud / Partner</text>
  <text x="92" y="381" font-size="12.5" font-weight="600" fill="#1F1F1F">BGP Peer</text>

  <!-- ============ Callout 1 ============ -->
  <rect x="253" y="8" width="140" height="122" rx="4" fill="#EEF3FC" stroke="#4A7FD0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="263" y="30" font-size="11.5" font-weight="700" fill="#1B5EAB">1. Routes received</text>
  <text x="276" y="46" font-size="11.5" font-weight="700" fill="#1B5EAB">from BGP peers</text>
  <g font-size="11" fill="#333333">
    <text x="270" y="70">&#8226; Prefixes</text>
    <text x="270" y="87">&#8226; AS Path</text>
    <text x="270" y="104">&#8226; Communities</text>
  </g>

  <!-- ============ Flows in ============ -->
  <path d="M190,142 H225 V222" fill="none" stroke="#1B5EAB" stroke-width="2"/>
  <path d="M225,222 H391" fill="none" stroke="#3F8F44" stroke-width="2" marker-end="url(#aGreen)"/>
  <path d="M190,250 H225" fill="none" stroke="#1B5EAB" stroke-width="2"/>
  <path d="M225,250 H391" fill="none" stroke="#3F8F44" stroke-width="2" marker-end="url(#aGreen)"/>
  <path d="M190,385 H225 V300" fill="none" stroke="#1B5EAB" stroke-width="2"/>
  <path d="M225,300 H391" fill="none" stroke="#3F8F44" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="233" y="205" font-size="11" fill="#333333">BGP</text>
  <text x="233" y="320" font-size="11" fill="#333333">BGP</text>

  <!-- ============ Main container ============ -->
  <rect x="400" y="62" width="525" height="518" rx="8" fill="#ffffff" stroke="#1B5EAB" stroke-width="2"/>
  <use href="#arrows4" transform="translate(580,95) scale(1.68)"/>
  <text x="613" y="100.5" font-size="18.6" font-weight="700" fill="#1B2A5E">Azure Route Server</text>

  <rect x="418" y="133" width="490" height="445" rx="4" fill="#F7F8FC" stroke="#E1E3EC" stroke-width="1.2"/>
  <text x="663" y="160" font-size="14.5" font-weight="700" fill="#1F1F1F" text-anchor="middle">Route maps applied</text>

  <!-- Inbound -->
  <rect x="433" y="172" width="460" height="185" rx="4" fill="#F1F9F1" stroke="#7CB97F" stroke-width="1.4"/>
  <text x="663" y="196" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">Inbound route map</text>
  <text x="663" y="212" font-size="11" fill="#555555" text-anchor="middle">(Applied to routes received)</text>

  <rect x="448" y="216" width="135" height="134" rx="3" fill="#ffffff" stroke="#CFE3CF" stroke-width="1.2"/>
  <use href="#funnel" transform="translate(460,226)"/>
  <text x="484" y="240" font-size="12" font-weight="700" fill="#1F1F1F">MATCH</text>
  <g font-size="11" fill="#333333">
    <text x="458" y="264">Match routes</text>
    <text x="458" y="279">based on:</text>
    <text x="458" y="298">&#8226; Prefix / IP range</text>
    <text x="458" y="314">&#8226; AS Path</text>
    <text x="458" y="330">&#8226; BGP Community</text>
  </g>

  <rect x="608" y="219" width="125" height="120" rx="3" fill="#ffffff" stroke="#CFE3CF" stroke-width="1.2"/>
  <use href="#gear" transform="translate(628,238)"/>
  <text x="644" y="242" font-size="11.5" font-weight="700" fill="#1F1F1F">SET (Optional)</text>
  <g font-size="11" fill="#333333">
    <text x="618" y="266">Modify route</text>
    <text x="618" y="281">attributes:</text>
    <text x="618" y="300">&#8226; BGP Community</text>
    <text x="618" y="316">&#8226; AS</text>
  </g>

  <rect x="763" y="223" width="115" height="124" rx="3" fill="#ffffff" stroke="#CFE3CF" stroke-width="1.2"/>
  <text x="772" y="242" font-size="11.5" font-weight="700" fill="#1F1F1F">PERMIT / DENY</text>
  <use href="#okCircle" transform="translate(790,268)"/>
  <use href="#noCircle" transform="translate(822,268)"/>
  <g font-size="11" fill="#333333">
    <text x="771" y="298">Permit (accept)</text>
    <text x="771" y="313">or Deny (drop)</text>
    <text x="771" y="328">the route</text>
  </g>

  <path d="M585,283 H604" fill="none" stroke="#3F8F44" stroke-width="1.8" marker-end="url(#aGreen)"/>
  <path d="M735,283 H759" fill="none" stroke="#3F8F44" stroke-width="1.8" marker-end="url(#aGreen)"/>

  <!-- Outbound -->
  <rect x="433" y="370" width="460" height="200" rx="4" fill="#F6F2FB" stroke="#B9A3DC" stroke-width="1.4"/>
  <text x="663" y="394" font-size="13" font-weight="700" fill="#1F1F1F" text-anchor="middle">Outbound route map</text>
  <text x="663" y="410" font-size="11" fill="#555555" text-anchor="middle">(Applied to routes advertised)</text>

  <rect x="448" y="416" width="135" height="134" rx="3" fill="#ffffff" stroke="#DDD2EE" stroke-width="1.2"/>
  <use href="#funnel" transform="translate(460,426)"/>
  <text x="484" y="440" font-size="12" font-weight="700" fill="#1F1F1F">MATCH</text>
  <g font-size="11" fill="#333333">
    <text x="458" y="464">Match routes</text>
    <text x="458" y="479">in RIB based on:</text>
    <text x="458" y="498">&#8226; Prefix / IP range</text>
    <text x="458" y="514">&#8226; AS Path</text>
    <text x="458" y="530">&#8226; BGP Community</text>
  </g>

  <rect x="608" y="419" width="125" height="120" rx="3" fill="#ffffff" stroke="#DDD2EE" stroke-width="1.2"/>
  <use href="#gear" transform="translate(628,438)"/>
  <text x="644" y="442" font-size="11.5" font-weight="700" fill="#1F1F1F">SET (Optional)</text>
  <g font-size="11" fill="#333333">
    <text x="618" y="466">Modify route</text>
    <text x="618" y="481">attributes:</text>
    <text x="618" y="500">&#8226; BGP Community</text>
    <text x="618" y="516">&#8226; AS</text>
  </g>

  <rect x="763" y="423" width="115" height="124" rx="3" fill="#ffffff" stroke="#DDD2EE" stroke-width="1.2"/>
  <text x="772" y="442" font-size="11.5" font-weight="700" fill="#1F1F1F">PERMIT / DENY</text>
  <use href="#okCircle" transform="translate(790,468)"/>
  <use href="#noCircle" transform="translate(822,468)"/>
  <g font-size="11" fill="#333333">
    <text x="771" y="498">Permit (advertise)</text>
    <text x="771" y="513">or Deny (suppress)</text>
    <text x="771" y="528">the route</text>
  </g>

  <path d="M585,483 H604" fill="none" stroke="#8E6FC0" stroke-width="1.8" marker-end="url(#aPurple)"/>
  <path d="M735,483 H759" fill="none" stroke="#8E6FC0" stroke-width="1.8" marker-end="url(#aPurple)"/>

  <!-- ============ Callout 2 ============ -->
  <rect x="940" y="8" width="163" height="112" rx="4" fill="#F1F9F1" stroke="#4E9A51" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="950" y="30" font-size="11.5" font-weight="700" fill="#1F1F1F">2. Inbound route map</text>
  <text x="959" y="46" font-size="10.5" fill="#333333">Applied per peer (inbound)</text>
  <g font-size="11" fill="#333333">
    <text x="955" y="68">&#8226; Filter unwanted routes</text>
    <text x="955" y="86">&#8226; Modify attributes</text>
    <text x="955" y="104">&#8226; Control acceptance</text>
  </g>

  <!-- ============ Callout 3 ============ -->
  <rect x="215" y="470" width="164" height="102" rx="4" fill="#F6F2FB" stroke="#8E6FC0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="225" y="490" font-size="11.5" font-weight="700" fill="#1F1F1F">3. Outbound route map</text>
  <text x="234" y="506" font-size="10.5" fill="#333333">Applied per peer (outbound)</text>
  <g font-size="11" fill="#333333">
    <text x="228" y="527">&#8226; Control what is advertised</text>
    <text x="228" y="544">&#8226; Modify attributes</text>
    <text x="228" y="561">&#8226; Traffic engineering</text>
  </g>
  <path d="M379,483 H429" fill="none" stroke="#8E6FC0" stroke-width="1.8" stroke-dasharray="5 3" marker-end="url(#aPurple)"/>

  <!-- ============ Right column ============ -->
  <path d="M925,192 H1166" fill="none" stroke="#3F8F44" stroke-width="2" marker-end="url(#aGreen)"/>
  <path d="M925,272 H1166" fill="none" stroke="#3F8F44" stroke-width="2" marker-end="url(#aGreen)"/>
  <text x="1032" y="238" font-size="13" font-weight="600" fill="#1B5EAB">Advertised to VNets</text>

  <rect x="1170" y="158" width="178" height="68" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#vnetIcon" transform="translate(1204,192)"/>
  <text x="1242" y="187" font-size="12.5" font-weight="600" fill="#1F1F1F">VNet A</text>
  <text x="1242" y="204" font-size="11.5" fill="#333333">10.0.0.0/16</text>

  <rect x="1170" y="238" width="178" height="68" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#vnetIcon" transform="translate(1204,272)"/>
  <text x="1242" y="267" font-size="12.5" font-weight="600" fill="#1F1F1F">VNet B</text>
  <text x="1242" y="284" font-size="11.5" fill="#333333">10.1.0.0/16</text>

  <path d="M925,330 H1085 V426 H1166" fill="none" stroke="#1B5EAB" stroke-width="2" marker-end="url(#aBlue)"/>
  <path d="M1085,426 V541 H1166" fill="none" stroke="#1B5EAB" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="1094" y="400" font-size="11" fill="#333333">BGP</text>
  <text x="1094" y="530" font-size="11" fill="#333333">BGP</text>
  <text x="1178" y="492" font-size="13" font-weight="600" fill="#1B5EAB">Advertised to BGP Peers</text>

  <rect x="1170" y="390" width="178" height="72" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#fw" transform="translate(1204,418) scale(0.82)"/>
  <use href="#arrows4" transform="translate(1206,437) scale(0.86)"/>
  <text x="1242" y="420" font-size="12.5" font-weight="600" fill="#1F1F1F">NVA / Firewall</text>
  <text x="1242" y="437" font-size="11" fill="#555555">(BGP Peer)</text>

  <rect x="1170" y="505" width="178" height="72" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <use href="#cloud" transform="translate(1204,532) scale(0.85)"/>
  <use href="#arrows4" transform="translate(1206,548) scale(0.86)"/>
  <text x="1242" y="534" font-size="12.5" font-weight="600" fill="#1F1F1F">Cloud / Partner</text>
  <text x="1242" y="551" font-size="12.5" font-weight="600" fill="#1F1F1F">BGP Peer</text>

  <!-- ============ Azure VNet routes ============ -->
  <path d="M658,603 V588" fill="none" stroke="#4A7FD0" stroke-width="1.6" stroke-dasharray="4 3" marker-end="url(#aBlue)"/>
  <rect x="578" y="605" width="160" height="78" rx="4" fill="#F4F8FE" stroke="#4A7FD0" stroke-width="1.3" stroke-dasharray="4 3"/>
  <text x="658" y="626" font-size="11.5" font-weight="700" fill="#1B5EAB" text-anchor="middle">Azure VNet routes</text>
  <g font-size="9.8" fill="#333333" text-anchor="middle">
    <text x="658" y="645">VNet routes are not advertised</text>
    <text x="658" y="659">by default unless explicitly</text>
    <text x="658" y="673">distributed via BGP</text>
  </g>

  <!-- ============ Route map actions ============ -->
  <rect x="8" y="605" width="260" height="163" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <text x="20" y="628" font-size="12.5" font-weight="700" fill="#1F1F1F">Route map actions</text>
  <text x="20" y="652" font-size="11" font-weight="700" fill="#1F1F1F">Action</text>
  <text x="88" y="652" font-size="11" font-weight="700" fill="#1F1F1F">Description</text>
  <path d="M18,660 H258" stroke="#D8D8D8" stroke-width="1"/>
  <g font-size="10.5" fill="#333333">
    <text x="20" y="680">MATCH</text><text x="88" y="680">Select routes based on conditions</text>
    <text x="20" y="704">SET</text><text x="88" y="704">Modify route attributes</text>
    <text x="20" y="728">PERMIT</text><text x="88" y="728">Accept and continue</text>
    <text x="20" y="752" fill="#D83B01">DENY</text><text x="88" y="752" fill="#D83B01">Drop / suppress</text>
  </g>

  <!-- ============ Common use cases ============ -->
  <rect x="282" y="605" width="285" height="163" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <text x="294" y="628" font-size="12.5" font-weight="700" fill="#1F1F1F">Common use cases</text>
  <g font-size="10.5" fill="#333333">
    <text x="294" y="656">&#8226; Filter private or unwanted prefixes (RFC 1918)</text>
    <text x="294" y="677">&#8226; Accept only specific prefixes from peers</text>
    <text x="294" y="698">&#8226; Set local preference for preferred path selection</text>
    <text x="294" y="719">&#8226; Tag routes with BGP communities for downstream policy</text>
    <text x="294" y="740">&#8226; Influence outbound path selection (traffic engineering)</text>
  </g>

  <!-- ============ Legend ============ -->
  <rect x="758" y="605" width="262" height="163" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <text x="770" y="631" font-size="12.5" font-weight="700" fill="#1F1F1F">Legend</text>
  <g font-size="9.8" fill="#333333">
    <path d="M772,658 H808" fill="none" stroke="#1B5EAB" stroke-width="2.2" marker-end="url(#aBlue)"/>
    <text x="822" y="662">BGP session / route flow (input / output)</text>
    <path d="M772,685 H808" fill="none" stroke="#3F8F44" stroke-width="2.2" marker-end="url(#aGreen)"/>
    <text x="822" y="689">Permitted / advertised routes</text>
    <path d="M772,712 H808" fill="none" stroke="#D83B01" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#aRed)"/>
    <text x="822" y="716">Denied / dropped routes</text>
    <path d="M772,739 H808" fill="none" stroke="#8E6FC0" stroke-width="2.2" stroke-dasharray="5 3" marker-end="url(#aPurple)"/>
    <text x="822" y="743">Internal processing</text>
  </g>

  <!-- ============ Notes ============ -->
  <rect x="1030" y="605" width="318" height="163" rx="4" fill="#ffffff" stroke="#C7C7C7" stroke-width="1.3"/>
  <text x="1042" y="631" font-size="12.5" font-weight="700" fill="#1F1F1F">Notes</text>
  <g font-size="10.5" fill="#333333">
    <text x="1042" y="658">&#8226; Route maps are configured on each BGP connection</text>
    <text x="1051" y="673">per direction (inbound and outbound).</text>
    <text x="1042" y="695">&#8226; Inbound route map is applied before routes are</text>
    <text x="1051" y="710">accepted into the server.</text>
    <text x="1042" y="732">&#8226; Outbound route map is applied before routes are</text>
    <text x="1051" y="747">advertised to the peer.</text>
  </g>
</svg>
