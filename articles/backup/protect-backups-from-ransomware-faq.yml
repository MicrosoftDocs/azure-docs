title: Frequently asked questions - Protect backups from ransomware
summary: |
  This article answers common questions about protecting backups from ransomware with the [Azure Backup](./backup-overview.md) service.

sections:
  - name: Ignored
    questions:
      - question: What are the best practices to configure and protect Azure backups against security and ransomware threats?
        answer: |
          Apply the recommendations in [Azure Backup security best practices](azure-backup-data-protection-best-practices.md) to configure access controls, protect backup data, monitor activity, and plan recovery. For an overview of Azure Backup security capabilities, including Logically air-gapped vault protection and Cyber recovery essentials, see [Security and cyber recovery in Azure Backup](security-overview.md).

      - question: How can I block intentional or unintentional deletion of backup data?
        answer: |
          Use soft delete to retain deleted backup data for its configured retention period, and configure Multi-user authorization (MUA) to require approval for critical operations. Availability and configuration depend on the workload and vault. For details, see [soft delete](secure-by-default.md) and [Multi-user authorization (MUA)](multi-user-authorization-concept.md).

      - question: How can I restore a system affected by ransomware?
        answer: |
          If backups are available from before the attack, coordinate recovery with your incident response team:

          - Review the incident timeline and identify a recovery point that predates the impact.
          - Restore to an isolated, secure environment and scan the restored data for signs of infection.
          - Validate the recovered workloads before returning them to production.
          - Confirm that backup protection is configured and healthy on recovered workloads.
          - Review the recovery process and address any gaps.

      - question: Will an infected backup copy impact existing clean recovery points?
        answer: An infected recovery point doesn't change earlier recovery points. Before restoring, review the incident timeline and validate that the selected recovery point and restored workload are appropriate for recovery.

      - question: How can I extend the expiration of recovery points during an incident?
        answer: If you need more time during an investigation, review the workload's retention options. For Azure VM backups, increasing the retention duration can also extend retention for existing recovery points; behavior varies by workload and policy. For details, see [how retention changes affect recovery points](backup-architecture.md#impact-of-policy-change-on-recovery-points).
